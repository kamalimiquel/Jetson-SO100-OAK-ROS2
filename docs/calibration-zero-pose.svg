<text x="90" y="280" fill="#3fb950" font-size="13" font-weight="bold">✓ flat, straight, at table height</text>
<text x="120" y="302" fill="#8d99ad" font-size="11.5">pan centred · lift, elbow, wrist straight · jaws half open</text>
