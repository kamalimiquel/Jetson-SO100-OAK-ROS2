<text x="42" y="133" fill="#e8edf5" font-size="14" font-weight="bold">DEVICES</text>
<rect x="410" y="110" width="780" height="1150" fill="none" stroke="#263042"/>
<rect x="410" y="110" width="780" height="34" fill="#1a2436"/>
<text x="422" y="133" fill="#e8edf5" font-size="14" font-weight="bold">JETSON XAVIER NX 16 GB — Docker, one container per job</text>
<rect x="1210" y="110" width="420" height="1150" fill="none" stroke="#263042"/>
<rect x="1210" y="110" width="420" height="34" fill="#1a2436"/>
<text x="1222" y="133" fill="#e8edf5" font-size="14" font-weight="bold">WINDOWS 11 HOME PC — LAN</text>
<rect x="50" y="170" width="320" height="108" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="64" y="194" fill="#7ee2a8" font-size="14" font-weight="bold">SO-100 arm 1 + arm 2 — 6 axes each</text>
<text x="64" y="212" fill="#8892a6" font-size="11">Feetech bus over two CH9102 adapters (12 Mb/s), keyed by serial</text>
<text x="64" y="227" fill="#8892a6" font-size="11">arm1 5971081400 -&gt; /dev/arm1_tty (+so100_arm) · so100_cell</text>
<text x="64" y="242" fill="#8892a6" font-size="11">arm2 5A46085595 -&gt; /dev/arm2_tty · so100_cell_b</text>
<rect x="50" y="285" width="320" height="92" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="64" y="309" fill="#7ee2a8" font-size="14" font-weight="bold">OAK-D POE — scene camera</text>
<text x="64" y="327" fill="#8892a6" font-size="11">colour IMX378 + 2× OV9282, 7.5 cm baseline</text>
<text x="64" y="342" fill="#8892a6" font-size="11">USB 3 at 5 Gb/s — needs the USB 3 cable of §3.1</text>
<rect x="50" y="392" width="320" height="122" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="64" y="416" fill="#7ee2a8" font-size="14" font-weight="bold">2× USB RGB webcams — wrist</text>
<text x="64" y="434" fill="#8892a6" font-size="11">one on each moving jaw, 640x480 at 10 Hz (ADR-0022)</text>
<text x="64" y="449" fill="#8892a6" font-size="11">UVC, USB full speed (12 Mb/s)</text>
<text x="64" y="464" fill="#8892a6" font-size="11">arm1 046d:08aa -&gt; /dev/arm1_wrist · arm2 VF0770 041e:4095 -&gt; /dev/arm2_wrist</text>
<text x="64" y="479" fill="#8892a6" font-size="11">focus at 10-15 cm: the §10.5 procedure (per camera)</text>
<rect x="430" y="170" width="350" height="110" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="444" y="194" fill="#7ee2a8" font-size="14" font-weight="bold">so100-arm (arm 1) + so100-arm2 (arm 2)</text>
<text x="444" y="212" fill="#8892a6" font-size="11">joint servers :8002/:8003 · torque proxies :8092/:8095</text>
<text x="444" y="227" fill="#8892a6" font-size="11">/joint_states and /arm2/joint_states at 50 Hz</text>
<text x="444" y="242" fill="#8892a6" font-size="11">TF prefix arm2_ · base-&gt;arm2_base static at 0, 0.30, 0</text>
<rect x="430" y="306" width="350" height="168" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="444" y="330" fill="#7ee2a8" font-size="14" font-weight="bold">so100-cams</text>
<text x="444" y="348" fill="#8892a6" font-size="11">oak_cams: colour/left/right (JPEG), depth, confidence,</text>
<text x="444" y="363" fill="#8892a6" font-size="11">/oak/scene/points — x,y,z,rgb in the colour frame</text>
<text x="444" y="378" fill="#8892a6" font-size="11">oak_stream_views: 5 Hz colourised depth + confidence</text>
<text x="444" y="393" fill="#8892a6" font-size="11">wrist_cam ×2: /gripper/image/compressed and</text>
<text x="444" y="408" fill="#8892a6" font-size="11">  /arm2/gripper/image/compressed at 10 Hz (Cams tab picks one)</text>
<text x="444" y="423" fill="#8892a6" font-size="11">viewers: :8090 stereo+confidence, :8091 cloud</text>
<rect x="430" y="490" width="350" height="132" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="444" y="514" fill="#7ee2a8" font-size="14" font-weight="bold">so100-control</text>
<text x="444" y="532" fill="#8892a6" font-size="11">ik + arm2_ik: /ik/target and /arm2/ik/target (in base / arm2_base) →</text>
<text x="444" y="547" fill="#8892a6" font-size="11">/ik/solution, /arm2/ik/solution · /joint_targets if IK_APPLY=1</text>
<text x="444" y="562" fill="#8892a6" font-size="11">DLS + geometric Jacobian · 0.0 mm median round trip</text>
<rect x="430" y="626" width="350" height="96" rx="8" fill="#171a21" stroke="#6b7280" stroke-dasharray="7 5"/>
<text x="444" y="650" fill="#9aa4b2" font-size="14" font-weight="bold">so100-perception</text>
<text x="444" y="668" fill="#8892a6" font-size="11">empty: the grasp pipeline lands here</text>
<text x="444" y="683" fill="#8892a6" font-size="11">segmentation → GraspGen request</text>
<rect x="430" y="738" width="350" height="150" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="444" y="762" fill="#7ee2a8" font-size="14" font-weight="bold">so100-web</text>
<text x="444" y="780" fill="#8892a6" font-size="11">tabs page :80 (six tabs incl. Cams) · ttyd :7681</text>
<text x="444" y="795" fill="#8892a6" font-size="11">RViz2 :6080 (on demand) — both arms (arm2_ TF prefix) + colour + 2 cams</text>
<text x="444" y="810" fill="#8892a6" font-size="11">rqt_graph :6081</text>
<text x="444" y="825" fill="#8892a6" font-size="11">torque proxies :8092/:8095 · power + RViz control :8099</text>
<rect x="430" y="904" width="350" height="96" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="444" y="928" fill="#7ee2a8" font-size="14" font-weight="bold">so100-rosbridge</text>
<text x="444" y="946" fill="#8892a6" font-size="11">rosbridge_websocket at ws://:9090</text>
<text x="444" y="961" fill="#8892a6" font-size="11">any LAN client reads the whole cell as JSON</text>
<rect x="430" y="1024" width="740" height="62" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="444" y="1046" fill="#7ee2a8" font-size="14" font-weight="bold">ROS2 bus — FastDDS · domain 42 · network + ipc host</text>
<text x="444" y="1066" fill="#8892a6" font-size="11">thirteen nodes standing today — sixteen when RViz is up — discovered from every container </text>
<rect x="1230" y="170" width="380" height="92" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="1244" y="194" fill="#7ee2a8" font-size="14" font-weight="bold">Browser on the PC</text>
<text x="1244" y="212" fill="#8892a6" font-size="11">the seven tabs over HTTP + noVNC (no ROS on Windows)</text>
<text x="1244" y="227" fill="#8892a6" font-size="11">Cams (Arm 1 / Arm 2) · torque switch · shutdown</text>
<rect x="1230" y="285" width="380" height="92" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="1244" y="309" fill="#7ee2a8" font-size="14" font-weight="bold">MuJoCo twin</text>
<text x="1244" y="327" fill="#8892a6" font-size="11">roslibpy → ws://&lt;xavier&gt;:9090</text>
<text x="1244" y="342" fill="#8892a6" font-size="11">mirrors /joint_states + /arm2/joint_states (two arms, 0.30 m)</text>
<rect x="1230" y="400" width="380" height="92" rx="8" fill="#10251a" stroke="#3fb950"/>
<text x="1244" y="424" fill="#7ee2a8" font-size="14" font-weight="bold">F710 teleop — Python client</text>
<text x="1244" y="442" fill="#8892a6" font-size="11">roslibpy → ws://&lt;xavier&gt;:9090 · no ROS on Windows</text>
<text x="1244" y="457" fill="#8892a6" font-size="11">joint-step + cartesian-feel · hold A 5 s switches arms · torque per arm</text>
<rect x="1230" y="515" width="380" height="92" rx="8" fill="#171a21" stroke="#6b7280" stroke-dasharray="7 5"/>
<text x="1244" y="539" fill="#9aa4b2" font-size="14" font-weight="bold">GraspGen</text>
<text x="1244" y="557" fill="#8892a6" font-size="11">runs here, served over HTTP</text>
<text x="1244" y="572" fill="#8892a6" font-size="11">needs the grasp pipeline and the IK node</text>
<rect x="1230" y="630" width="380" height="92" rx="8" fill="#171a21" stroke="#6b7280" stroke-dasharray="7 5"/>
<text x="1244" y="654" fill="#9aa4b2" font-size="14" font-weight="bold">Policy training (MuJoCo)</text>
<text x="1244" y="672" fill="#8892a6" font-size="11">needs episode recording + LeRobot export</text>
