<text x="36" y="44" fill="#e8edf5" font-size="25" font-weight="bold">Jetson-SO100-OAK-ROS2 — data flow (two-arm configuration, 2026-11-13)</text>
<text x="36" y="68" fill="#8892a6" font-size="13">ROS2 Humble · FastDDS · domain 42 · one container per job · generated by tools/make_architecture_flow.py</text>
<rect x="1215" y="40" width="18" height="12" rx="3" fill="#10251a" stroke="#3fb950"/>
<text x="1239" y="51" fill="#8892a6" font-size="12">live / verified</text>
