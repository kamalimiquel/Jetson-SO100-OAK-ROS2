  ARM_NS: {arm: arm1, arm2: arm2}
  IK_APPLY: "0"
  ARBITER_ENFORCE: "1"
  ARM_WRITE_MODE: arbiter
  RECORD_DIR: ""            # recorder off: no /episodes episode is being written
