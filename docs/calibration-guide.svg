<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1420" font-family="DejaVu Sans, sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d99036"/></marker></defs>
<rect width="1500" height="1420" fill="#0b1220"/>
<text x="40" y="46" fill="#e8edf5" font-size="25" font-weight="bold">SO-100 — poses for lerobot-calibrate</text>
<text x="40" y="72" fill="#8d99ad" font-size="13">Step 1: mid-range pose (arm half-bent, gripper ~50 %). Step 2: sweep each joint slowly through its full range, one at a time, and return to mid before the next.</text>
<rect x="40" y="96" width="520" height="560" rx="10" fill="#141b2a" stroke="#263042"/>
<text x="60" y="126" fill="#3fb950" font-size="16" font-weight="bold">STEP 1 — mid-range pose</text>
<text x="60" y="148" fill="#8d99ad" font-size="12">All joints near the middle of their travel · gripper half open</text>
<rect x="125.0" y="540" width="90" height="22" rx="4" fill="#8fa0b8"/>
