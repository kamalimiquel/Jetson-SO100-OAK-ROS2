<text x="40" y="950" fill="#8d99ad" font-size="12">Sweep = move the joint slowly from one end to the other (a few seconds) and back. If a joint hits a hard stop, stop pushing: that is its mechanical limit.</text>
<rect x="40" y="1000" width="1420" height="300" rx="10" fill="#10151d" stroke="#263042"/>
<text x="60" y="1030" fill="#e8edf5" font-size="15" font-weight="bold">How to run it on the Xavier</text>
<text x="60" y="1058" fill="#8d99ad" font-family="DejaVu Sans Mono, monospace" font-size="12.5"># 1. the arm container must release the serial port first</text>
<text x="60" y="1084" fill="#3fb950" font-family="DejaVu Sans Mono, monospace" font-size="12.5">docker stop so100-arm</text>
<text x="60" y="1110" fill="#8d99ad" font-family="DejaVu Sans Mono, monospace" font-size="12.5"># 2. calibrate (two interactive steps: mid-range, then the sweep)</text>
<text x="60" y="1136" fill="#3fb950" font-family="DejaVu Sans Mono, monospace" font-size="12.5">~/lerobot/.venv/bin/lerobot-calibrate --robot.type=so100_follower \</text>
<text x="60" y="1162" fill="#3fb950" font-family="DejaVu Sans Mono, monospace" font-size="12.5">    --robot.port=/dev/ttyACM0 --robot.id=so100_cell</text>
<text x="60" y="1188" fill="#8d99ad" font-family="DejaVu Sans Mono, monospace" font-size="12.5"># 3. bring the arm back</text>
<text x="60" y="1214" fill="#3fb950" font-family="DejaVu Sans Mono, monospace" font-size="12.5">docker start so100-arm</text>
<text x="60" y="1254" fill="#8d99ad" font-size="11.5">The result overwrites ~/.cache/huggingface/lerobot/calibration/robots/so_follower/so100_cell.json — the arm container reads it on start.</text>
</svg>