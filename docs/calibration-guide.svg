<line x1="179.03576768757713" y1="312.22049585999497" x2="196.03576768757713" y2="286.22049585999497" stroke="#c9d3e0" stroke-width="7" stroke-linecap="round"/>
<text x="60" y="600" fill="#8d99ad" font-size="12">torque is OFF: hold the arm so it does not fall</text>
<text x="60" y="620" fill="#8d99ad" font-size="12">press Enter only when the pose is stable</text>
<text x="300" y="380" fill="#d99036" font-size="12" font-weight="bold">M1 shoulder_pan</text>
<text x="300" y="393" fill="#8d99ad" font-size="11.5">arm vertical, base turned to its centre</text>
<text x="300" y="412" fill="#d99036" font-size="12" font-weight="bold">M2 shoulder_lift</text>
<text x="300" y="425" fill="#8d99ad" font-size="11.5">upper arm ~25-30 deg back from vertical</text>
<text x="300" y="444" fill="#d99036" font-size="12" font-weight="bold">M3 elbow_flex</text>
<text x="300" y="457" fill="#8d99ad" font-size="11.5">forearm bent ~60 deg</text>
<text x="300" y="476" fill="#d99036" font-size="12" font-weight="bold">M4 wrist_flex</text>
<text x="300" y="489" fill="#8d99ad" font-size="11.5">wrist ~35 deg, gripper pointing up-forward</text>
<text x="300" y="508" fill="#d99036" font-size="12" font-weight="bold">M5 wrist_roll</text>
<text x="300" y="521" fill="#8d99ad" font-size="11.5">any comfortable angle (it is a roll)</text>
<text x="300" y="540" fill="#d99036" font-size="12" font-weight="bold">M6 gripper</text>
<text x="300" y="553" fill="#8d99ad" font-size="11.5">half open</text>
<rect x="590" y="96" width="430" height="250" rx="10" fill="#141b2a" stroke="#263042"/>
<text x="608" y="124" fill="#e8edf5" font-size="14" font-weight="bold">B1  shoulder_pan — M1</text>
<text x="608" y="144" fill="#8d99ad" font-size="11.5">rotate the whole arm left / right</text>
