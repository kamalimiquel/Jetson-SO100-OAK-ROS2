# Cell stack — five containers, one per domain (ADR-0003).
# Host network (ADR-0002: FastDDS, domain 42, LAN-visible), ipc: host (ADR-0005:
# /dev/shm shared — the host tmpfs is 7.3 GB on the Xavier, no tuning needed).
# SDK strategy (hybrid, ADR-0006/0007): arm bind-mounts the host LeRobot venv;
# cams installs the depthai<3 wheel in-container; perception/control use the
# image's own rclpy; web carries no SDK.

services:
  arm:
    image: dustynv/ros:humble-ros-base-l4t-r35.4.1
    container_name: so100-arm
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Static transform of the wrist webcam (ADR-0022): metres from the moving-jaw link to the
      # lens, then rpy to the optical convention. Nominal bracket values — measure and override,
      # README §10.5. Set here (not in the entrypoint) so the numbers live beside the hardware.
      - WRIST_TF_X=0.0
      - WRIST_TF_Y=-0.028
      - WRIST_TF_Z=0.035
      - WRIST_TF_ROLL=3.14159
      - WRIST_TF_PITCH=0.0
      - WRIST_TF_YAW=0.0
    devices:
      # Stable symlink (udev rule from scripts/provision-jetson.sh): the adapter re-enumerates
      # to ttyACM1 when anything else on the USB tree is plugged or unplugged, and a container
      # started against the old node keeps a dead device forever.
      - /dev/so100_arm:/dev/ttyACM0
    volumes:
      # Host LeRobot venv (py3.12) + the uv-managed CPython it symlinks to + calibration.
      - /home/maju/lerobot/.venv:/home/maju/lerobot/.venv:ro
      - /home/maju/.local/share/uv/python:/home/maju/.local/share/uv/python:ro
      - /home/maju/.cache/huggingface/lerobot:/home/maju/.cache/huggingface/lerobot
      - ./ws:/opt/ws:ro
    command: ["bash", "/opt/ws/arm/entry.sh"]

  cams:
    build:
      context: ..
      dockerfile: docker/cams.Dockerfile
    image: so100-cams:latest
    container_name: so100-cams
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Intrinsics are NOT set here on purpose: the depth map is delivered in the
      # right camera's geometry, so the node asks the device for that camera's K at
      # the resolution the map actually arrives at (1280x720 -> fx 833.00 cx 639.23).
      # The env pair only survives as a fallback for a unit with no calibration.
      # DEPTH_SCALE corrects a depth map that comes out proportional instead of mm.
      - OAK_SCENE_DEPTH_SCALE=1.0
    volumes:
      # OAK devices (VID 03e7) + the cgroup rule below (ADR-0007).
      - /dev/bus/usb:/dev/bus/usb
      # Wrist camera (ADR-0022): a udev symlink, so re-enumeration to another /dev/videoN does
      # not need a compose edit. scripts/provision-jetson.sh writes the rule.
      - /dev/so100_wrist:/dev/so100_wrist
      - ./ws:/opt/ws
      - ../tools:/opt/tools:ro
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 81:* rmw"
    command: ["bash", "/opt/ws/cams/entry.sh"]

  perception:
    image: dustynv/ros:humble-ros-base-l4t-r35.4.1
    container_name: so100-perception
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ./ws:/opt/ws
    command: ["sleep", "infinity"]

  control:
    image: dustynv/ros:humble-ros-base-l4t-r35.4.1
    container_name: so100-control
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - IK_APPLY=0
    volumes:
      - ./ws:/opt/ws
      - ../tools:/opt/tools:ro
    command: ["bash", "/opt/ws/control/entry.sh"]

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: so100-web:latest
    container_name: so100-web
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ./web:/srv/web
      # The entrypoint and the shutdown server are COPYed into the image, so editing them in
      # docker/web/ only took effect after a rebuild — mount them instead: a script fix is then
      # `docker compose up -d --force-recreate web`, ten seconds instead of a full build.
      - ./web/entry.sh:/entry.sh:ro
      - ./web/shutdown_server.py:/shutdown_server.py:ro
      # maju password for the shutdown button (600 on host, never in the repo)
      - /home/maju/.shutdown-secret:/run/secrets/shutdown-secret:ro

  # rosbridge (MuJoCo twin transport, WebSocket :9090). Standalone jammy image
  # because rosbridge_suite humble needs Python >=3.9 and the cell images are
  # focal/py3.8. DDS over host net reaches the cell containers (domain 42).
  rosbridge:
    build:
      context: ..
      dockerfile: docker/rosbridge.Dockerfile
    image: so100-rosbridge:latest
    container_name: so100-rosbridge
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
