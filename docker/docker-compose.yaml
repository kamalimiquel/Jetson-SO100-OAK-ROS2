# Cell stack — five containers, one per domain (ADR-0003).
# Host network (ADR-0002: FastDDS, domain 42, LAN-visible), ipc: host (ADR-0005:
# /dev/shm shared — the host tmpfs is 7.3 GB on the Xavier, no tuning needed).
# SDK strategy (hybrid, ADR-0006/0007): arm bind-mounts the host LeRobot venv;
# cams installs the depthai<3 wheel in-container; perception/control use the
# image's own rclpy; web carries no SDK.

services:
  arm:
    image: dustynv/ros:humble-ros-base-l4t-r35.4.1
    container_name: so100-arm
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Symmetric namespaces (ADR-0023): arm 1 is /arm1/* and arm1_* like arm 2 is /arm2/*,
      # so no bare topic or frame exists to collide with arm 2. The released 1.0 surface
      # (/joint_states, /joint_targets, ...) is served by compat_bridge.py, not by this arm.
      - ARM_NS=arm1
      # Who writes to the bus: "direct" (this bridge, the deployed arrangement) or "arbiter"
      # (docker/ws/control/arbiter.py is the only writer; pair with ARBITER_ENFORCE=1).
      - ARM_WRITE_MODE=${ARM_WRITE_MODE:-direct}
      # Apply the measured joint scale to /write (ADR-0026). Off by default: with it on, degrees
      # are read as physical. The table is per arm and the server refuses one measured elsewhere.
      - JOINT_SCALE_APPLY=${JOINT_SCALE_APPLY:-0}
      # Comma-separated joints that are physically absent this session (unplugged servo, failed link).
      # They leave the read/write set and every command must name them as held.
      - ABSENT_MOTORS=${ABSENT_MOTORS:-}
      # open (default) or autonomy: under autonomy the bare /joint_targets is refused instead of mapped
      # and /write needs a claimed arm. MCP spec, chapter 2.
      - SURFACE_POLICY=${SURFACE_POLICY:-open}
      # Static transform of the wrist webcam (ADR-0022): metres from the moving-jaw link to the
      # lens, then rpy to the optical convention. Nominal bracket values — measure and override,
      # README §12.5. Set here (not in the entrypoint) so the numbers live beside the hardware.
      - WRIST_TF_X=0.0
      - WRIST_TF_Y=-0.028
      - WRIST_TF_Z=0.035
      - WRIST_TF_ROLL=3.14159
      - WRIST_TF_PITCH=0.0
      - WRIST_TF_YAW=0.0
    devices:
      # Stable symlink (udev rule from scripts/provision-jetson.sh): the adapter re-enumerates
      # to ttyACM1 when anything else on the USB tree is plugged or unplugged, and a container
      # started against the old node keeps a dead device forever.
      - /dev/so100_arm:/dev/ttyACM0
    volumes:
      # Interactive bash that already knows where ROS is (see docker/bashrc-cell).
      - ./bashrc-cell:/root/.bashrc:ro
      # Host LeRobot venv (py3.12) + the uv-managed CPython it symlinks to + calibration.
      - /home/maju/lerobot/.venv:/home/maju/lerobot/.venv:ro
      - /home/maju/.local/share/uv/python:/home/maju/.local/share/uv/python:ro
      - /home/maju/.cache/huggingface/lerobot:/home/maju/.cache/huggingface/lerobot
      - ./ws:/opt/ws:ro
    command: ["bash", "/opt/ws/arm/entry.sh"]

  # Second SO-100 (two-arm plan, Phase 1). Same image and entrypoint; the
  # namespace/ports/frames come from env: ARM_NS renames the topics to /arm2/*
  # and prefixes the TF as arm2_ (frame_prefix + wrist frames + base->arm2_base
  # at 0,0.30,0). Its joint server is on :8003, its torque proxy on :8095, and
  # its calibration id is its own (so100_cell_b) so the arms never overwrite JSON.
  arm2:
    image: dustynv/ros:humble-ros-base-l4t-r35.4.1
    container_name: so100-arm2
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ARM_NS=arm2
      - ARM_WRITE_MODE=${ARM_WRITE_MODE:-direct}
      # Apply the measured joint scale to /write (ADR-0026). Off by default: with it on, degrees
      # are read as physical. The table is per arm and the server refuses one measured elsewhere.
      - JOINT_SCALE_APPLY=${JOINT_SCALE_APPLY:-0}
      # Comma-separated joints that are physically absent this session (unplugged servo, failed link).
      # They leave the read/write set and every command must name them as held.
      - ABSENT_MOTORS=${ABSENT_MOTORS:-}
      # open (default) or autonomy: under autonomy the bare /joint_targets is refused instead of mapped
      # and /write needs a claimed arm. MCP spec, chapter 2.
      - SURFACE_POLICY=${SURFACE_POLICY:-open}
      - JOINT_PORT=8003
      - TORQUE_PORT=8095
      # lerobot_joint_server reads these itself (Phase 1):
      - PORT=8003
      - SO100_PORT=/dev/ttyACM0
      - SO100_ID=so100_cell_b
      # The 30 cm (README §15 R3) — metres, published once on base->arm2_base.
      - ARM2_OFFSET_X=0.0
      - ARM2_OFFSET_Y=0.30
      - ARM2_OFFSET_Z=0.0
      - WRIST_TF_X=0.0
      - WRIST_TF_Y=-0.028
      - WRIST_TF_Z=0.035
      - WRIST_TF_ROLL=3.14159
      - WRIST_TF_PITCH=0.0
      - WRIST_TF_YAW=0.0
    devices:
      # Phase 0 udev rule (provision-jetson.sh): serial 5A46085595 -> /dev/arm2_tty.
      - /dev/arm2_tty:/dev/ttyACM0
    volumes:
      # Interactive bash that already knows where ROS is (see docker/bashrc-cell).
      - ./bashrc-cell:/root/.bashrc:ro
      - /home/maju/lerobot/.venv:/home/maju/lerobot/.venv:ro
      - /home/maju/.local/share/uv/python:/home/maju/.local/share/uv/python:ro
      - /home/maju/.cache/huggingface/lerobot:/home/maju/.cache/huggingface/lerobot
      - ./ws:/opt/ws:ro
    command: ["bash", "/opt/ws/arm/entry.sh"]

  cams:
    build:
      context: ..
      dockerfile: docker/cams.Dockerfile
    image: so100-cams:latest
    container_name: so100-cams
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Intrinsics are NOT set here on purpose: the depth map is delivered in the
      # right camera's geometry, so the node asks the device for that camera's K at
      # the resolution the map actually arrives at (1280x720 -> fx 833.00 cx 639.23).
      # The env pair only survives as a fallback for a unit with no calibration.
      # DEPTH_SCALE corrects a depth map that comes out proportional instead of mm.
      - OAK_SCENE_DEPTH_SCALE=1.0
    volumes:
      # Interactive bash that already knows where ROS is (see docker/bashrc-cell).
      - ./bashrc-cell:/root/.bashrc:ro
      # OAK devices (VID 03e7) + the cgroup rule below (ADR-0007).
      - /dev/bus/usb:/dev/bus/usb
      # Wrist camera (ADR-0022): a udev symlink, so re-enumeration to another /dev/videoN does
      # not need a compose edit. scripts/provision-jetson.sh writes the rule. arm2's webcam on
      # its own symlink (two-arm plan, Phase 2).
      # ADR-0023: arm 1's camera is /dev/arm1_wrist like arm 2's is /dev/arm2_wrist; the legacy
      # so100_wrist alias stays mounted so nothing that still names it breaks.
      - /dev/arm1_wrist:/dev/arm1_wrist
      - /dev/so100_wrist:/dev/so100_wrist
      - /dev/arm2_wrist:/dev/arm2_wrist
      - ./ws:/opt/ws
      - ../tools:/opt/tools:ro
      # The typed surface (ros/so100_cell_interfaces). entry.sh builds it at boot into the container's
      # own workspace: a few seconds, and it cannot go stale against the mounted source.
      - ../ros:/opt/ros_src:ro
      # Built here once and reused: see the note in control/entry.sh. Not in git.
      - ${IFACE_CACHE:-./iface_cache}:/opt/iface_cache
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 81:* rmw"
    command: ["bash", "/opt/ws/cams/entry.sh"]

  perception:
    image: dustynv/ros:humble-ros-base-l4t-r35.4.1
    container_name: so100-perception
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      # Interactive bash that already knows where ROS is (see docker/bashrc-cell).
      - ./bashrc-cell:/root/.bashrc:ro
      - ./ws:/opt/ws
    command: ["sleep", "infinity"]

  control:
    image: dustynv/ros:humble-ros-base-l4t-r35.4.1
    container_name: so100-control
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - IK_APPLY=0
      # The single writer (docker/ws/control/arbiter.py). 0 = observe and validate only, the
      # deployed arrangement where arm_bridge writes; 1 = the arbiter claims each arm's lease and
      # is the only writer, which needs ARM_WRITE_MODE=arbiter on the arm containers too.
      - ARBITER_ENFORCE=${ARBITER_ENFORCE:-0}
      - COMMAND_TTL_S=0.5
      # Episodes (recorder.py). Empty RECORD_DIR = the recorder does not start.
      - RECORD_DIR=${RECORD_DIR:-}
      - RECORD_INSTRUCTION=${RECORD_INSTRUCTION:-}
      - RECORD_HZ=5
    volumes:
      # Interactive bash that already knows where ROS is (see docker/bashrc-cell).
      - ./bashrc-cell:/root/.bashrc:ro
      - ./ws:/opt/ws
      - ../tools:/opt/tools:ro
      # The typed surface (ros/so100_cell_interfaces). entry.sh builds it at boot into the container's
      # own workspace: a few seconds, and it cannot go stale against the mounted source.
      - ../ros:/opt/ros_src:ro
      # Built here once and reused: see the note in control/entry.sh. Not in git.
      - ${IFACE_CACHE:-./iface_cache}:/opt/iface_cache
      # Episode files land here; a host directory so they survive the container.
      - ${EPISODES_DIR:-./episodes}:/episodes
    command: ["bash", "/opt/ws/control/entry.sh"]

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: so100-web:latest
    container_name: so100-web
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      # Interactive bash that already knows where ROS is (see docker/bashrc-cell).
      - ./bashrc-cell:/root/.bashrc:ro
      - ./web:/srv/web
      # The entrypoint and the shutdown server are COPYed into the image, so editing them in
      # docker/web/ only took effect after a rebuild — mount them instead: a script fix is then
      # `docker compose up -d --force-recreate web`, ten seconds instead of a full build.
      - ./web/entry.sh:/entry.sh:ro
      - ./web/shutdown_server.py:/shutdown_server.py:ro
      - ./state:/srv/state          # measurements written by the focus tab (CSV)
      # maju password for the shutdown button (600 on host, never in the repo)
      - /home/maju/.shutdown-secret:/run/secrets/shutdown-secret:ro
      # maju password for the terminal tab (SSH to the host, 600 on host, never in the repo)
      - /home/maju/.terminal-secret:/run/secrets/terminal-secret:ro

  # rosbridge (MuJoCo twin transport, WebSocket :9090). Standalone jammy image
  # because rosbridge_suite humble needs Python >=3.9 and the cell images are
  # focal/py3.8. DDS over host net reaches the cell containers (domain 42).
  rosbridge:
    build:
      context: ..
      dockerfile: docker/rosbridge.Dockerfile
    image: so100-rosbridge:latest
    container_name: so100-rosbridge
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      # Interactive bash that already knows where ROS is (see docker/bashrc-cell).
      - ./bashrc-cell:/root/.bashrc:ro
