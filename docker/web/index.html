<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SO-100 cell — web interface</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  nav { display: flex; gap: 0.5em; padding: 0.5em; background: #1c2733; }
  nav button { padding: 0.5em 1em; border: 0; border-radius: 4px; background: #2e3d4e; color: #d8e1ec; cursor: pointer; }
  nav button.active { background: #4a90d9; color: #fff; }
  nav button#shutdown { margin-left: auto; background: #c0392b; color: #fff; font-weight: bold; }
  /* torque switch: red = servos free (boot state), orange = energised */
  nav button#torque { background: #c0392b; color: #fff; font-weight: bold; margin-right: 0.9em;
                      border: 1px solid #7f2a1f; }
  nav button#torque.on { background: #e07b1f; border-color: #9c5413; }
  nav button#torque:disabled { opacity: 0.6; cursor: progress; }
  nav span.sep { width: 1px; background: #3c4c60; margin: 0.15em 0.4em; }
  iframe { flex: 1; border: 0; background: #10151c; display: none; }
  iframe.active { display: block; }
</style>
</head>
<body>
<nav>
  <button id="torque" title="Energise the servos (arm is free to move by hand until then)">Torque brazo</button>
  <span class="sep"></span>
  <button class="active" data-tab="term">Terminal</button>
  <button data-tab="stereo">Stereo Cam</button>
  <button data-tab="cloud">Point Cloud</button>
  <button data-tab="graph">Graph</button>
  <button data-tab="rviz">RViz</button>
  <span id="rvizstate" style="align-self:center;color:#8d99ad;font-size:12px"></span>
  <button id="shutdown">Shutdown Xavier NX</button>
</nav>
<iframe class="active" data-pane="term"></iframe>
<iframe data-pane="stereo"></iframe>
<iframe data-pane="cloud"></iframe>
<iframe data-pane="graph"></iframe>
<iframe data-pane="rviz"></iframe>
<script>
  // No placeholder: the page derives the host from its own URL, so it works
  // from any address (LAN IP, hostname) without a provisioning-time rewrite.
  const HOST = location.hostname;
  const TAB_URLS = {
    rviz:  `http://${HOST}:6080/vnc.html?autoconnect=true&resize=scale`,
    stereo: `http://${HOST}:8090/stereo`,
    cloud:  `http://${HOST}:8091/`,
    graph: `http://${HOST}:6081/vnc.html?autoconnect=true&resize=scale`,
    term:  `http://${HOST}:7681`,
  };

  // RViz with software GL costs about two of the Xavier's six cores, so it only runs while
  // its tab is on screen: opening the tab starts it, leaving the tab stops it.
  const RVIZ_API = `http://${HOST}:8099`;
  const rvizState = document.getElementById("rvizstate");
  let rvizPoll = null;

  function sayRviz(text) { if (rvizState) rvizState.textContent = text; }

  async function rvizRunning() {
    try {
      const r = await fetch(`${RVIZ_API}/rviz/state`, { cache: "no-store" });
      return !!(await r.json()).running;
    } catch (e) { return false; }
  }

  async function rvizOn() {
    sayRviz("RViz: arrancando…");
    try { await fetch(`${RVIZ_API}/rviz/start`, { method: "POST" }); } catch (e) {}
    // rviz2 needs ~10 s before the window shows up on the VNC display
    let tries = 0;
    clearInterval(rvizPoll);
    rvizPoll = setInterval(async () => {
      tries += 1;
      if (await rvizRunning()) {
        clearInterval(rvizPoll);
        rvizPoll = null;
        sayRviz("RViz: en marcha");
        setTimeout(() => sayRviz(""), 4000);
      } else if (tries > 40) {
        clearInterval(rvizPoll);
        rvizPoll = null;
        sayRviz("RViz: no arranca");
      }
    }, 1000);
  }

  async function rvizOff() {
    clearInterval(rvizPoll);
    rvizPoll = null;
    sayRviz("");
    try { await fetch(`${RVIZ_API}/rviz/stop`, { method: "POST" }); } catch (e) {}
  }

  function showTab(btn) {
    const tab = btn.dataset.tab;
    document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll("iframe").forEach((f) => f.classList.remove("active"));
    btn.classList.add("active");
    const pane = document.querySelector(`iframe[data-pane="${tab}"]`);
    pane.classList.add("active");
    if (!pane.src) {
      pane.src = TAB_URLS[tab];
      pane.addEventListener("load", () => { pane.focus(); });
    }
    pane.focus();
    if (tab === "rviz") rvizOn(); else rvizOff();
  }

  document.querySelectorAll("nav button[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => showTab(btn));
  });

  // Closing the page should not leave RViz burning CPU in the background.
  addEventListener("pagehide", () => {
    try { navigator.sendBeacon(`${RVIZ_API}/rviz/stop`); } catch (e) {}
  });

  // Load the initially active tab (Terminal) right away.
  const initial = document.querySelector("nav button.active");
  if (initial) showTab(initial);

  // Torque switch: the joint server is loopback-only, so the page talks to the arm
  // container's tiny proxy on :8092. The arm always boots with torque OFF, so the
  // state is read from the hardware on load rather than remembered here.
  const torqueBtn = document.getElementById("torque");
  const TORQUE_URL = `http://${HOST}:8092/torque`;

  function paintTorque(on) {
    torqueBtn.classList.toggle("on", on);
    torqueBtn.textContent = on ? "Quitar torque" : "Torque brazo";
  }

  async function readTorque() {
    try {
      const r = await fetch(TORQUE_URL, { cache: "no-store" });
      paintTorque(!!(await r.json()).torque);
    } catch (e) {
      paintTorque(false);          // unreachable means we cannot energise anything
    }
  }

  torqueBtn.addEventListener("click", async () => {
    const want = !torqueBtn.classList.contains("on");
    torqueBtn.disabled = true;
    try {
      const r = await fetch(TORQUE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ on: want }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      paintTorque(!!data.torque);
    } catch (e) {
      alert("Torque: " + e.message);
      readTorque();
    } finally {
      torqueBtn.disabled = false;
    }
  });

  readTorque();
  setInterval(readTorque, 5000);   // keep it honest if another client flips it

  // Shutdown: POST to the web container's endpoint, which SSHes to the host
  // and runs `sudo shutdown -h now`.
  document.getElementById("shutdown").addEventListener("click", async () => {
    if (!confirm("Power off the Xavier NX?")) return;
    const btn = document.getElementById("shutdown");
    btn.disabled = true;
    btn.textContent = "Shutting down…";
    try {
      const resp = await fetch(`http://${HOST}:8099/shutdown`, { method: "POST" });
      const data = await resp.json();
      alert(data.status === "ok" ? "Shutdown command sent — the Xavier is going down." : "Shutdown failed: " + data.output);
    } catch (e) {
      alert("Shutdown endpoint unreachable: " + e);
    }
    btn.disabled = false;
    btn.textContent = "Shutdown Xavier NX";
  });
</script>
</body>
</html>
