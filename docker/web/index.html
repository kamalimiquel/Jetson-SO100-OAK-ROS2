<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SO-100 cell — web interface</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  nav { display: flex; gap: 0.5em; padding: 0.5em; background: #1c2733; }
  nav button { padding: 0.5em 1em; border: 0; border-radius: 4px; background: #2e3d4e; color: #d8e1ec; cursor: pointer; }
  nav button.active { background: #4a90d9; color: #fff; }
  iframe { flex: 1; border: 0; background: #10151c; display: none; }
  iframe.active { display: block; }
</style>
</head>
<body>
<nav>
  <button class="active" data-tab="view3d">3D view</button>
  <button data-tab="graph">Graph</button>
  <button data-tab="term">Terminal</button>
</nav>
<iframe class="active" data-pane="view3d"></iframe>
<iframe data-pane="graph"></iframe>
<iframe data-pane="term"></iframe>
<script>
  // __HOST__ is replaced with the Xavier's LAN address at provisioning time.
  // Foxglove Studio runs in the browser and auto-connects to the bridge via
  // the ds.url parameter; the Graph tab opens the same studio (use its
  // Rosgraph panel once — the layout is remembered per browser).
  const STUDIO = "https://studio.foxglove.dev/?ds=foxglove-websocket&ds.url=ws%3A%2F%2F__HOST__%3A8765";
  const TAB_URLS = {
    view3d: STUDIO,
    graph:  STUDIO,
    term:   "http://__HOST__:7681",
  };
  document.querySelectorAll("nav button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll("iframe").forEach((f) => f.classList.remove("active"));
      btn.classList.add("active");
      const pane = document.querySelector(`iframe[data-pane="${btn.dataset.tab}"]`);
      pane.classList.add("active");
      if (!pane.src) pane.src = TAB_URLS[btn.dataset.tab];
    });
  });
</script>
</body>
</html>
